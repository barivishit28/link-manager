<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manager</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 1.5rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .card {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(51, 65, 85, 0.7);
      border-radius: 0.85rem;
      padding: 1.25rem;
      box-shadow: 0 8px 20px -4px rgba(0, 0, 0, 0.3);
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      color: #cbd5e1;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.85rem;
      margin-bottom: 1rem;
    }

    @media (min-width: 768px) {
      .form-grid {
        grid-template-columns: 1fr 1fr 1fr;
      }
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .input-group label {
      font-size: 0.75rem;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .input-field {
      width: 100%;
      padding: 0.65rem 0.85rem;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 0.6rem;
      color: #f8fafc;
      font-size: 0.875rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-field:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    .input-field.error-border {
      border-color: #f43f5e;
    }

    .error-text {
      color: #fb7185;
      font-size: 0.8rem;
      margin-bottom: 0.75rem;
      display: none;
    }

    .btn-primary {
      width: 100%;
      padding: 0.65rem 1rem;
      background-color: #4f46e5;
      color: #ffffff;
      border: none;
      border-radius: 0.6rem;
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
    }

    .btn-primary:hover {
      background-color: #4338ca;
    }

    .links-header {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1rem;
    }

    @media (min-width: 640px) {
      .links-header {
        flex-direction: row;
        align-items: center;
      }
    }

    .counter-badge {
      background-color: #334155;
      color: #94a3b8;
      font-size: 0.75rem;
      padding: 0.15rem 0.5rem;
      border-radius: 9999px;
      margin-left: 0.35rem;
    }

    .search-wrapper {
      position: relative;
      width: 100%;
    }

    @media (min-width: 640px) {
      .search-wrapper {
        width: 240px;
      }
    }

    .search-icon {
      position: absolute;
      left: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      display: flex;
      align-items: center;
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      padding: 0.45rem 0.75rem 0.45rem 2.1rem;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 0.6rem;
      color: #f8fafc;
      font-size: 0.825rem;
      outline: none;
    }

    .search-input:focus {
      border-color: #6366f1;
    }

    .item-list {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .record-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 0.75rem;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      position: relative;
    }

    .record-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.75rem;
    }

    @media (min-width: 768px) {
      .record-grid {
        grid-template-columns: 1fr 1fr 1fr;
      }
    }

    .field-box {
      background-color: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 0.5rem;
      padding: 0.6rem 0.75rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.4rem;
    }

    .field-label {
      font-size: 0.68rem;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .field-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      word-break: break-word;
    }

    .field-text {
      font-size: 0.85rem;
      color: #e2e8f0;
      line-height: 1.3;
    }

    .field-link {
      font-size: 0.85rem;
      color: #818cf8;
      text-decoration: none;
      word-break: break-all;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
    }

    .field-link:hover {
      text-decoration: underline;
    }

    .btn-copy {
      padding: 0.3rem 0.6rem;
      background-color: #334155;
      color: #cbd5e1;
      border: 1px solid #475569;
      border-radius: 0.4rem;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .btn-copy:hover {
      background-color: rgba(99, 102, 241, 0.2);
      color: #a5b4fc;
      border-color: #6366f1;
    }

    .btn-copy.copied {
      background-color: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border-color: #10b981;
    }

    .record-actions {
      display: flex;
      justify-content: flex-end;
      border-top: 1px solid #334155;
      padding-top: 0.5rem;
      margin-top: 0.1rem;
    }

    .btn-delete {
      padding: 0.3rem 0.6rem;
      background-color: transparent;
      color: #64748b;
      border: 1px solid transparent;
      border-radius: 0.4rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.75rem;
      transition: all 0.2s ease;
    }

    .btn-delete:hover {
      color: #fb7185;
      background-color: rgba(244, 63, 94, 0.1);
      border-color: rgba(244, 63, 94, 0.2);
    }

    .empty-state {
      text-align: center;
      padding: 2rem 1rem;
      color: #64748b;
      border: 2px dashed #334155;
      border-radius: 0.75rem;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- Add Item Form Card -->
    <div class="card">
      <div class="card-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        Add Entry
      </div>

      <form id="add-entry-form">
        <div class="form-grid">
          <!-- Column 1: Link -->
          <div class="input-group">
            <label for="url-input">Link (URL)</label>
            <input type="text" id="url-input" class="input-field" placeholder="e.g. https://github.com" />
          </div>

          <!-- Column 2: Description -->
          <div class="input-group">
            <label for="desc-input">Description</label>
            <input type="text" id="desc-input" class="input-field" placeholder="e.g. Code repository platform" />
          </div>

          <!-- Column 3: Text -->
          <div class="input-group">
            <label for="text-input">Text</label>
            <input type="text" id="text-input" class="input-field" placeholder="e.g. API Keys / Notes / Snippets" />
          </div>
        </div>

        <div id="error-msg" class="error-text"></div>

        <button type="submit" class="btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          Add Record
        </button>
      </form>
    </div>

    <!-- Records Display Card -->
    <div class="card">
      <div class="links-header">
        <div class="card-title" style="margin-bottom: 0;">
          Saved Items
          <span id="counter-badge" class="counter-badge">0</span>
        </div>

        <div id="search-wrapper" class="search-wrapper" style="display: none;">
          <span class="search-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </span>
          <input type="text" id="search-input" class="search-input" placeholder="Search entries..." />
        </div>
      </div>

      <div id="item-list" class="item-list"></div>
      <div id="empty-state" class="empty-state" style="display: none;">
        <p id="empty-text">No entries saved yet. Fill in the fields above to save an item!</p>
      </div>
    </div>

  </div>

  <script>
    // --- Application State ---
    let records = [];
    let searchQuery = '';

    // --- DOM Elements ---
    const form = document.getElementById('add-entry-form');
    const urlInput = document.getElementById('url-input');
    const descInput = document.getElementById('desc-input');
    const textInput = document.getElementById('text-input');
    const errorMsg = document.getElementById('error-msg');
    const itemListContainer = document.getElementById('item-list');
    const emptyState = document.getElementById('empty-state');
    const emptyText = document.getElementById('empty-text');
    const counterBadge = document.getElementById('counter-badge');
    const searchWrapper = document.getElementById('search-wrapper');
    const searchInput = document.getElementById('search-input');

    const STORAGE_KEY = 'multi_column_manager_items';

    // --- LocalStorage Helpers ---
    function loadFromStorage() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          return JSON.parse(saved);
        } catch (e) {
          console.error('Failed to parse storage', e);
        }
      }
      return [
        {
          id: '1',
          url: 'https://react.dev',
          description: 'Official documentation for React',
          text: 'npx create-react-app my-app'
        },
        {
          id: '2',
          url: 'https://github.com',
          description: 'GitHub source code hosting',
          text: 'git push origin main'
        }
      ];
    }

    function saveToStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    }

    function formatUrl(string) {
      if (!string) return '';
      if (!string.startsWith('http://') && !string.startsWith('https://')) {
        return `https://${string}`;
      }
      return string;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, function(m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[m];
      });
    }

    function render() {
      counterBadge.textContent = records.length;

      if (records.length > 0) {
        searchWrapper.style.display = 'block';
      } else {
        searchWrapper.style.display = 'none';
      }

      const filtered = records.filter(item =>
        (item.url && item.url.toLowerCase().includes(searchQuery.toLowerCase())) ||
        (item.description && item.description.toLowerCase().includes(searchQuery.toLowerCase())) ||
        (item.text && item.text.toLowerCase().includes(searchQuery.toLowerCase()))
      );

      itemListContainer.innerHTML = '';

      if (filtered.length === 0) {
        emptyState.style.display = 'block';
        emptyText.textContent = records.length === 0
          ? 'No entries saved yet. Fill in the fields above to save an item!'
          : 'No matching entries found.';
      } else {
        emptyState.style.display = 'none';

        filtered.forEach(item => {
          const card = document.createElement('div');
          card.className = 'record-card';

          const formattedUrl = formatUrl(item.url);

          card.innerHTML = `
            <div class="record-grid">
              <!-- Link Column Section -->
              <div class="field-box">
                <span class="field-label">Link</span>
                <div class="field-content">
                  ${formattedUrl 
                    ? `<a href="${escapeHtml(formattedUrl)}" target="_blank" rel="noopener noreferrer" class="field-link">
                        ${escapeHtml(item.url)}
                        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                       </a>`
                    : `<span class="field-text" style="opacity: 0.4;">—</span>`
                  }
                  ${formattedUrl 
                    ? `<button class="btn-copy" data-copy="${escapeHtml(formattedUrl)}">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        Copy
                       </button>` 
                    : ''
                  }
                </div>
              </div>

              <!-- Description Column Section -->
              <div class="field-box">
                <span class="field-label">Description</span>
                <div class="field-content">
                  <span class="field-text">${item.description ? escapeHtml(item.description) : '<span style="opacity: 0.4;">—</span>'}</span>
                  ${item.description 
                    ? `<button class="btn-copy" data-copy="${escapeHtml(item.description)}">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        Copy
                       </button>` 
                    : ''
                  }
                </div>
              </div>

              <!-- Text Column Section -->
              <div class="field-box">
                <span class="field-label">Text</span>
                <div class="field-content">
                  <span class="field-text">${item.text ? escapeHtml(item.text) : '<span style="opacity: 0.4;">—</span>'}</span>
                  ${item.text 
                    ? `<button class="btn-copy" data-copy="${escapeHtml(item.text)}">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        Copy
                       </button>` 
                    : ''
                  }
                </div>
              </div>
            </div>

            <!-- Record Actions -->
            <div class="record-actions">
              <button class="btn-delete" data-id="${item.id}">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                Delete Record
              </button>
            </div>
          `;

          itemListContainer.appendChild(card);
        });
      }
    }

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      showError('');

      const rawUrl = urlInput.value.trim();
      const rawDesc = descInput.value.trim();
      const rawText = textInput.value.trim();

      if (!rawUrl && !rawDesc && !rawText) {
        showError('Please enter at least one field (Link, Description, or Text).');
        return;
      }

      const newRecord = {
        id: Date.now().toString(),
        url: rawUrl,
        description: rawDesc,
        text: rawText
      };

      records.unshift(newRecord);
      saveToStorage();
      render();

      urlInput.value = '';
      descInput.value = '';
      textInput.value = '';
    });

    searchInput.addEventListener('input', function(e) {
      searchQuery = e.target.value;
      render();
    });

    itemListContainer.addEventListener('click', function(e) {
      const copyBtn = e.target.closest('.btn-copy');
      const deleteBtn = e.target.closest('.btn-delete');

      if (copyBtn) {
        const textToCopy = copyBtn.getAttribute('data-copy');
        handleCopy(copyBtn, textToCopy);
      } else if (deleteBtn) {
        const id = deleteBtn.getAttribute('data-id');
        handleDelete(id);
      }
    });

    function handleCopy(button, text) {
      navigator.clipboard.writeText(text).then(() => {
        setCopySuccess(button);
      }).catch(() => {
        // Fallback copy method
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        setCopySuccess(button);
      });
    }

    function setCopySuccess(button) {
      button.classList.add('copied');
      button.innerHTML = `
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
        Copied!
      `;
      setTimeout(() => {
        button.classList.remove('copied');
        button.innerHTML = `
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          Copy
        `;
      }, 1800);
    }

    function handleDelete(id) {
      records = records.filter(item => item.id !== id);
      saveToStorage();
      render();
    }

    function showError(msg) {
      if (msg) {
        errorMsg.textContent = msg;
        errorMsg.style.display = 'block';
      } else {
        errorMsg.textContent = '';
        errorMsg.style.display = 'none';
      }
    }

    // --- Startup ---
    window.onload = function() {
      records = loadFromStorage();
      render();
    };
  </script>
</body>
</html>
