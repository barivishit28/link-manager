<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Text Keeper</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .card {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(51, 65, 85, 0.7);
      border-radius: 0.85rem;
      padding: 1.25rem;
      box-shadow: 0 8px 20px -4px rgba(0, 0, 0, 0.3);
    }

    .card-title {
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      color: #cbd5e1;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 0.85rem;
    }

    .input-field {
      width: 100%;
      padding: 0.75rem 0.85rem;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 0.6rem;
      color: #f8fafc;
      font-size: 0.9rem;
      outline: none;
      resize: vertical;
      min-height: 70px;
      transition: all 0.2s ease;
    }

    .input-field:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    .error-text {
      color: #fb7185;
      font-size: 0.8rem;
      margin-bottom: 0.75rem;
      display: none;
    }

    .btn-primary {
      width: 100%;
      padding: 0.65rem 1rem;
      background-color: #4f46e5;
      color: #ffffff;
      border: none;
      border-radius: 0.6rem;
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
    }

    .btn-primary:hover {
      background-color: #4338ca;
    }

    .list-header {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1rem;
    }

    @media (min-width: 500px) {
      .list-header {
        flex-direction: row;
        align-items: center;
      }
    }

    .counter-badge {
      background-color: #334155;
      color: #94a3b8;
      font-size: 0.75rem;
      padding: 0.15rem 0.5rem;
      border-radius: 9999px;
      margin-left: 0.35rem;
    }

    .search-wrapper {
      position: relative;
      width: 100%;
    }

    @media (min-width: 500px) {
      .search-wrapper {
        width: 200px;
      }
    }

    .search-icon {
      position: absolute;
      left: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      display: flex;
      align-items: center;
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      padding: 0.45rem 0.75rem 0.45rem 2.1rem;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 0.6rem;
      color: #f8fafc;
      font-size: 0.825rem;
      outline: none;
    }

    .search-input:focus {
      border-color: #6366f1;
    }

    .item-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .text-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 0.75rem;
      padding: 0.85rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      transition: border-color 0.2s ease;
    }

    .text-card:hover {
      border-color: #475569;
    }

    .text-content {
      font-size: 0.9rem;
      color: #e2e8f0;
      line-height: 1.4;
      word-break: break-word;
      white-space: pre-wrap;
      flex: 1;
    }

    .action-group {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-shrink: 0;
    }

    .btn-copy {
      padding: 0.4rem 0.75rem;
      background-color: #334155;
      color: #cbd5e1;
      border: 1px solid #475569;
      border-radius: 0.5rem;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.2s ease;
    }

    .btn-copy:hover {
      background-color: rgba(99, 102, 241, 0.2);
      color: #a5b4fc;
      border-color: #6366f1;
    }

    .btn-copy.copied {
      background-color: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border-color: #10b981;
    }

    .btn-delete {
      padding: 0.4rem;
      background-color: transparent;
      color: #64748b;
      border: 1px solid transparent;
      border-radius: 0.5rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .btn-delete:hover {
      color: #fb7185;
      background-color: rgba(244, 63, 94, 0.1);
      border-color: rgba(244, 63, 94, 0.2);
    }

    .empty-state {
      text-align: center;
      padding: 2rem 1rem;
      color: #64748b;
      border: 2px dashed #334155;
      border-radius: 0.75rem;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- Add Text Input Card -->
    <div class="card">
      <div class="card-title">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        Add Text
      </div>

      <form id="add-text-form">
        <div class="input-group">
          <textarea id="text-input" class="input-field" placeholder="Type or paste text here..."></textarea>
        </div>

        <div id="error-msg" class="error-text"></div>

        <button type="submit" class="btn-primary">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          Add Text
        </button>
      </form>
    </div>

    <!-- Saved Text Items Card -->
    <div class="card">
      <div class="list-header">
        <div class="card-title" style="margin-bottom: 0;">
          Saved Text
          <span id="counter-badge" class="counter-badge">0</span>
        </div>

        <div id="search-wrapper" class="search-wrapper" style="display: none;">
          <span class="search-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </span>
          <input type="text" id="search-input" class="search-input" placeholder="Search text..." />
        </div>
      </div>

      <div id="item-list" class="item-list"></div>
      <div id="empty-state" class="empty-state" style="display: none;">
        <p id="empty-text">No text entries saved yet. Add your first text item above!</p>
      </div>
    </div>

  </div>

  <script>
    // --- State Management ---
    let items = [];
    let searchQuery = '';

    // --- DOM Handles ---
    const form = document.getElementById('add-text-form');
    const textInput = document.getElementById('text-input');
    const errorMsg = document.getElementById('error-msg');
    const itemListContainer = document.getElementById('item-list');
    const emptyState = document.getElementById('empty-state');
    const emptyText = document.getElementById('empty-text');
    const counterBadge = document.getElementById('counter-badge');
    const searchWrapper = document.getElementById('search-wrapper');
    const searchInput = document.getElementById('search-input');

    const STORAGE_KEY = 'plain_text_keeper_items';

    // --- LocalStorage Logic ---
    function loadFromStorage() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          return JSON.parse(saved);
        } catch (e) {
          console.error('Failed to parse storage', e);
        }
      }
      return [
        { id: '1', text: 'git push origin main' },
        { id: '2', text: 'npx create-react-app my-app' },
        { id: '3', text: 'Important Note: Remember to update API keys' }
      ];
    }

    function saveToStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, function(m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[m];
      });
    }

    // --- Render Logic ---
    function render() {
      counterBadge.textContent = items.length;

      if (items.length > 0) {
        searchWrapper.style.display = 'block';
      } else {
        searchWrapper.style.display = 'none';
      }

      const filtered = items.filter(item =>
        item.text && item.text.toLowerCase().includes(searchQuery.toLowerCase())
      );

      itemListContainer.innerHTML = '';

      if (filtered.length === 0) {
        emptyState.style.display = 'block';
        emptyText.textContent = items.length === 0
          ? 'No text entries saved yet. Add your first text item above!'
          : 'No matching text found.';
      } else {
        emptyState.style.display = 'none';

        filtered.forEach(item => {
          const card = document.createElement('div');
          card.className = 'text-card';

          card.innerHTML = `
            <div class="text-content">${escapeHtml(item.text)}</div>
            <div class="action-group">
              <button class="btn-copy" data-copy="${escapeHtml(item.text)}">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                Copy
              </button>
              <button class="btn-delete" data-id="${item.id}" title="Delete">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
              </button>
            </div>
          `;

          itemListContainer.appendChild(card);
        });
      }
    }

    // --- Form Handlers ---
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      showError('');

      const rawText = textInput.value.trim();

      if (!rawText) {
        showError('Please enter some text before adding.');
        return;
      }

      const newItem = {
        id: Date.now().toString(),
        text: rawText
      };

      items.unshift(newItem);
      saveToStorage();
      render();

      textInput.value = '';
    });

    searchInput.addEventListener('input', function(e) {
      searchQuery = e.target.value;
      render();
    });

    itemListContainer.addEventListener('click', function(e) {
      const copyBtn = e.target.closest('.btn-copy');
      const deleteBtn = e.target.closest('.btn-delete');

      if (copyBtn) {
        const textToCopy = copyBtn.getAttribute('data-copy');
        handleCopy(copyBtn, textToCopy);
      } else if (deleteBtn) {
        const id = deleteBtn.getAttribute('data-id');
        handleDelete(id);
      }
    });

    // --- Copy Functionality ---
    function handleCopy(button, text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          setCopySuccess(button);
        }).catch(() => {
          fallbackCopy(button, text);
        });
      } else {
        fallbackCopy(button, text);
      }
    }

    function fallbackCopy(button, text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      document.body.removeChild(textarea);
      setCopySuccess(button);
    }

    function setCopySuccess(button) {
      button.classList.add('copied');
      button.innerHTML = `
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
        Copied!
      `;
      setTimeout(() => {
        button.classList.remove('copied');
        button.innerHTML = `
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          Copy
        `;
      }, 1800);
    }

    function handleDelete(id) {
      items = items.filter(item => item.id !== id);
      saveToStorage();
      render();
    }

    function showError(msg) {
      if (msg) {
        errorMsg.textContent = msg;
        errorMsg.style.display = 'block';
      } else {
        errorMsg.textContent = '';
        errorMsg.style.display = 'none';
      }
    }

    // --- Initial Launch ---
    window.onload = function() {
      items = loadFromStorage();
      render();
    };
  </script>
</body>
</html>
